name: Desktop app

# Builds the Windows and Mac app in desktop/ (based on Handy) and keeps the
# installers as downloads on the run's page, under "Artifacts".
#
# On pull requests that change desktop/, TERMS.md (built into the app) or this
# file, and by hand from the
# Actions tab. Not on push: a run started by a push is labelled, publicly, with
# the name of the account that pushed.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "tools/make_desktop_icons.py"
      - "TERMS.md" # built into the app
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# The build only reads the code.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (64-bit)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
            bundle: desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifact: HoldToTalk-Windows-x64
            # Same target folder as the build above, so the tests reuse it.
            test_args: "--release"
          - name: Mac (Apple silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
            bundle: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact: HoldToTalk-Mac-AppleSilicon
            test_args: "--release --target aarch64-apple-darwin"
          - name: Mac (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
            bundle: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact: HoldToTalk-Mac-Intel

    defaults:
      run:
        working-directory: desktop

    steps:
      # The speech engine's native build has deep paths on Windows.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      # Actions are pinned to an exact commit (the version is in the comment),
      # as in tests.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: ${{ matrix.target }}
          cache-bin: false

      # Graphics-card speech recognition on Windows uses Vulkan.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan needs the SPIRV-Headers CMake package (as in Handy's build).
      - name: Install SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # Ship the Visual C++ runtime beside the app so it starts on PCs without
      # Microsoft's redistributable. build.rs copies the DLLs from these folders.
      - name: Locate the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ runtime folders not found under $archDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install the window's libraries
        run: bun install --frozen-lockfile

      - name: Build the app and its installer
        run: bun run tauri build ${{ matrix.args }}

      # The Terms of Use checks (src-tauri/src/terms.rs). The Intel Mac build
      # runs on an Apple silicon machine, so its tests could not run there.
      - name: Run the Terms of Use tests
        if: matrix.test_args
        working-directory: desktop/src-tauri
        run: "cargo test ${{ matrix.test_args }} --lib terms::"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30
