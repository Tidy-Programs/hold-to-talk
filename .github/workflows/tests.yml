name: tests

# On main and on pull requests (not on every branch push as well, which would
# run each change twice).
on:
  push:
    branches: [main]
  pull_request:

# The tests only read the code: no write access to the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to an exact commit (the version is in the comment),
      # so a moved tag cannot change what runs here. Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Core requirements only: no NVIDIA runtime (the tests use fakes for the
      # speech model, the microphone, the keyboard, the clipboard and Ollama).
      - name: Install the core requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the unit tests
        run: python -B -m unittest discover tests
