name: tests

# On pull requests only. A run started by a push is labelled, publicly, with
# the name of the account that pushed; a pull request run is labelled with
# whoever opened the pull request.
on:
  pull_request:

# The tests only read the code: no write access to the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to an exact commit (the version is in the comment),
      # so a moved tag cannot change what runs here. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Core requirements only: no NVIDIA runtime (the tests use fakes for the
      # speech model, the microphone, the keyboard, the clipboard and Ollama).
      - name: Install the core requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # From cmd, not the default PowerShell 7, and with PSModulePath cleared:
      # PowerShell 7's module path, handed down to the Windows PowerShell 5.1
      # the tests start, stops 5.1 loading its own Get-Acl, Get-FileHash and
      # Get-AuthenticodeSignature. Without the variable, 5.1 uses its defaults.
      - name: Run the unit tests
        shell: cmd
        env:
          PSModulePath: ""
        run: python -B -m unittest discover tests
